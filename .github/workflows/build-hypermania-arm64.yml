name: Build SHC2023 HyperMania ARM64

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container: debian:bullseye

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          printf '%s\n' \
            'deb [check-valid-until=no] http://snapshot.debian.org/archive/debian/20260610T000000Z/ bullseye main' \
            'deb [check-valid-until=no] http://snapshot.debian.org/archive/debian/20260610T000000Z/ bullseye-updates main' \
            'deb [check-valid-until=no] http://snapshot.debian.org/archive/debian-security/20260610T000000Z/ bullseye-security main' \
            > /etc/apt/sources.list
          printf 'Acquire::Check-Valid-Until "false";\n' > /etc/apt/apt.conf.d/99no-check-valid-until
          apt-get update
          apt-get install -y build-essential cmake git ca-certificates file zip

      - name: Clone exact SHC2023 HyperMania source
        run: |
          git clone https://github.com/tariq-nasheed/HyperMania.git HyperMania
          cd HyperMania
          git checkout 70ec09f17a40ee552a133546834d522aadd368c5
          git submodule update --init --recursive

      - name: Build HyperMania ARM64
        working-directory: HyperMania
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-O2 -DNDEBUG -DRETRO_REVISION=2 -DRETRO_MOD_LOADER_VER=2" \
            -DCMAKE_CXX_FLAGS="-O2 -DNDEBUG -DRETRO_REVISION=2 -DRETRO_MOD_LOADER_VER=2"
          cmake --build build --config Release --parallel

      - name: Build matching SHCLogo ARM64
        working-directory: HyperMania/src/SHCLogo-RSDKv5Decomp
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-O2 -DNDEBUG -DRETRO_REVISION=2 -DRETRO_MOD_LOADER_VER=2" \
            -DCMAKE_CXX_FLAGS="-O2 -DNDEBUG -DRETRO_REVISION=2 -DRETRO_MOD_LOADER_VER=2"
          cmake --build build --config Release --parallel

      - name: Verify ARM64 modules
        run: |
          file HyperMania/build/hypermania.so
          file HyperMania/src/SHCLogo-RSDKv5Decomp/build/SHCLogo.so
          readelf -h HyperMania/build/hypermania.so | grep -E 'Class:|Machine:'
          readelf -h HyperMania/src/SHCLogo-RSDKv5Decomp/build/SHCLogo.so | grep -E 'Class:|Machine:'
          test -f HyperMania/build/hypermania.so
          test -f HyperMania/src/SHCLogo-RSDKv5Decomp/build/SHCLogo.so
          test -f HyperMania/mod.ini
          test -d HyperMania/Data

      - name: Package exact SHC2023 mod
        run: |
          rm -rf release
          mkdir -p release/HyperMania
          cp HyperMania/mod.ini release/HyperMania/mod.ini
          cp HyperMania/build/hypermania.so release/HyperMania/hypermania.so
          cp HyperMania/src/SHCLogo-RSDKv5Decomp/build/SHCLogo.so release/HyperMania/SHCLogo.so
          cp -r HyperMania/Data release/HyperMania/Data
          cp HyperMania/MANUAL.md release/HyperMania/MANUAL.md
          printf '%s\n' \
            'ARM64 Linux build of the SHC2023 HyperMania source snapshot' \
            'Source commit: 70ec09f17a40ee552a133546834d522aadd368c5' \
            'Built for the Sonic Mania decomp ARM64 revision-2 environment' \
            > release/HyperMania/BUILD_INFO.txt
          cd release
          zip -r ../HyperMania-SHC2023-Anbernic-ARM64.zip HyperMania

      - name: Upload exact SHC2023 artifact
        uses: actions/upload-artifact@v6
        with:
          name: HyperMania-SHC2023-Anbernic-ARM64
          path: HyperMania-SHC2023-Anbernic-ARM64.zip
